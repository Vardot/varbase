name: Varbase
type: profile
description: Varbase is an enhanced Drupal distribution with a lot of necessities.
core_version_requirement: ~11.3.0
project: varbase
distribution:
  name: Varbase
  install:
    theme: varbase_installer_theme
    finish_url: '/'
version: 11.0.x-dev
forms:
  - '\Drupal\RecipeKit\Installer\Form\RecipesForm'
  - '\Drupal\RecipeKit\Installer\Form\SiteNameForm'

recipes:
  required: []
  # A list of recipe package names that will be applied if no additional recipes
  # are chosen by the user.
  default:
    - core/recipes/administrator_role
    - core/recipes/core_recommended_maintenance
    - core/recipes/core_recommended_performance
    - drupal_cms_admin_ui
    - drupal_cms_anti_spam
    - drupal_cms_authentication
    - drupal_cms_media
    - drupal_cms_page
    - drupal_cms_privacy_basic
    - drupal_cms_seo_basic
    - easy_email_express
    - drupal/varbase_admin_base
    - drupal/varbase_security_base
    - drupal/varbase_seo_base
    - drupal/varbase_webform_base
  optional:
    varbase_search_base:
      name: Search
      packages:
        - drupal/varbase_search_base
    varbase_privacy:
      name: Privacy
      packages:
        - drupal/varbase_privacy
    varbase_dev_base:
      name: Privacy
      packages:
        - drupal/varbase_dev_base
themes:
  - gin
  - vartheme_bs5

# This allows you to suppress messages set by the Drupal installer, or various modules,
# which you might not want to display to users during or after the install process.
# Each item in this list can either be a string, which is the untranslated message
# to suppress, or an array of two untranslated strings for pluralized messages which
# have singular and plural forms.
hide_messages: []
