name: Varbase
type: profile
description: Varbase is an enhanced Drupal distribution with a lot of necessities.
core_version_requirement: ~10.4.0 || ~11.1.0
project: varbase
distribution:
  name: Varbase
  install:
    theme: gin
version: 10.1.0-alpha1
install:
  - system
  - user
  - node
  - block
  - block_content
  - datetime
  - help
  - image
  - views
  - file
themes:
  - vartheme_bs5
  - gin

interface translation project: varbase
interface translation server pattern: profiles/contrib/varbase/translations/%language.po
