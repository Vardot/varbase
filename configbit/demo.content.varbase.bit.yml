# ==============================================================================
# List of varbase demo components, which they will be listed under the
# Extra components installation step, in the Demo content section.
# ==============================================================================
config_bit:
  type: list
  for: varbase.info.yml
  when:
    show_demo: true
    list:
      dependencies:
        varbase_demo:
          title: "Varbase Demo"
          description: "If you're evaluating Varbase, installing demo content will help you get an idea of how Varbase works, and what features are included."
          selected: true
          config_form: false
        varbase_media_demo:
          title: "Varbase Media Demo Assets"
          description: "Provide a pre-set of default media assets for all Varbase Media Types, which are needed in development, testing, and demos."
          selected: false
          config_form: false
